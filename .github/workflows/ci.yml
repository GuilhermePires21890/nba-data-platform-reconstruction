name: NBA Data Platform - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba_admin
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: nba_data_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run transformation and schema tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: nba_data_platform
          POSTGRES_USER: nba_admin
          POSTGRES_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: |
          python -m pytest tests/test_transformation.py tests/test_dataset_schema.py -v

      - name: Run API contract tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: nba_data_platform_test
          POSTGRES_USER: nba_admin
          POSTGRES_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          ALLOW_TEST_DB_RESET: "1"
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5432 -U nba_admin -d nba_data_platform -v ON_ERROR_STOP=1 -c "CREATE DATABASE nba_data_platform_test;"
          python -m pytest tests/test_api_contracts.py -v

      - name: Validate API startup
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: nba_data_platform
          POSTGRES_USER: nba_admin
          POSTGRES_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/
